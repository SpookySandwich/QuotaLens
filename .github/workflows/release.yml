name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "${{ github.event.inputs.version }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Restore
        run: dotnet restore .\QuotaLens.slnx

      - name: Build
        run: dotnet build .\QuotaLens.slnx -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test .\QuotaLens.slnx -c Release -p:Platform=x64 --no-restore

      - name: Package installer and portable zip
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Configuration Release -Platform x64 -Version "${{ steps.version.outputs.version }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # Without an explicit tag the action falls back to GITHUB_REF, which is a
          # branch ref on workflow_dispatch - so the manual path could build for 45
          # minutes and then fail at the last step with nothing to attach to.
          tag_name: v${{ steps.version.outputs.version }}
          name: QuotaLens ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            A native Windows desktop app that tracks your AI coding quota across
            50 providers in one window.

            **Install:** download `QuotaLens-Setup-${{ steps.version.outputs.version }}-win-x64.exe` and run it.
            Prefer no installer? `QuotaLens-portable-${{ steps.version.outputs.version }}-win-x64.zip` runs from any folder.

            Windows 10 1809 or newer, x64. Self-contained - no .NET install required.
          files: |
            artifacts/dist/QuotaLens-Setup-*-win-x64.exe
            artifacts/dist/QuotaLens-portable-*-win-x64.zip
