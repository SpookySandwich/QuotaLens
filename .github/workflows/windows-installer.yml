name: Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\QuotaLens.slnx

      - name: Build
        run: dotnet build .\QuotaLens.slnx -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test .\QuotaLens.slnx -c Release -p:Platform=x64 --no-restore
