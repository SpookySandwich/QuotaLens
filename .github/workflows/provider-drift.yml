name: Provider upstream compatibility drift

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - ".github/workflows/provider-drift.yml"
      - "provider-upstream-lock.json"
      - "scripts/check-provider-drift.ps1"
      - "winui/Core/Catalog.cs"
      - "winui.Tests/Core/ProviderUpstreamLockTests.cs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/provider-drift.yml"
      - "provider-upstream-lock.json"
      - "scripts/check-provider-drift.ps1"
      - "winui/Core/Catalog.cs"
      - "winui.Tests/Core/ProviderUpstreamLockTests.cs"

permissions:
  contents: read

concurrency:
  group: provider-upstream-compatibility-drift
  cancel-in-progress: true

jobs:
  check:
    name: Compare pinned CodexBar compatibility sources
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout QuotaLens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: quotalens
          persist-credentials: false

      - name: Checkout public CodexBar source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: steipete/CodexBar
          path: codexbar
          fetch-depth: 0
          persist-credentials: false

      - name: Check upstream compatibility drift
        id: drift
        shell: pwsh
        run: |
          $revision = git -C .\codexbar rev-parse HEAD
          $reportPath = Join-Path $env:RUNNER_TEMP "provider-upstream-compatibility-drift.txt"
          & pwsh -NoProfile -File .\quotalens\scripts\check-provider-drift.ps1 `
            -LockPath .\quotalens\provider-upstream-lock.json `
            -UpstreamPath .\codexbar `
            -Revision $revision 2>&1 | Tee-Object -FilePath $reportPath
          exit $LASTEXITCODE

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-upstream-compatibility-report
          if-no-files-found: warn
          retention-days: 30
          path: ${{ runner.temp }}/provider-upstream-compatibility-drift.txt
